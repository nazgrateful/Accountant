<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}LedgerLens{% endblock %} · LedgerLens</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%231f3a5f%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-size=%2716%27 text-anchor=%27middle%27 fill=%27%238fc1ff%27 font-family=%27sans-serif%27 font-weight=%27bold%27%3EL%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar">
  <a class="brand" href="{{ url_for('dashboard') }}">Ledger<span>Lens</span></a>
  <nav>
    {% set ep = request.endpoint %}
    <a href="{{ url_for('dashboard') }}" class="{{ 'active' if ep == 'dashboard' }}">Dashboard</a>
    <a href="{{ url_for('upload') }}" class="{{ 'active' if ep == 'upload' }}">Upload</a>
    <a href="{{ url_for('documents') }}" class="{{ 'active' if ep in ('documents', 'document_detail') }}">Documents</a>
    <a href="{{ url_for('transactions') }}" class="{{ 'active' if ep == 'transactions' }}">Transactions</a>
    <a href="{{ url_for('review') }}" class="{{ 'active' if ep == 'review' }}">Review</a>
    <a href="{{ url_for('rules') }}" class="{{ 'active' if ep == 'rules' }}">Rules</a>
  </nav>
</header>
<main>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
